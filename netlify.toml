[build]
  publish = "public_deploy"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/stock"
  to = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/results"
  to = "/results.html"
  status = 200
